name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]  
    
  # Permite darle al botón manual si quieres forzarlo
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://trekar99:$HF_TOKEN@huggingface.co/spaces/trekar99/jazz-gpt-navigator main